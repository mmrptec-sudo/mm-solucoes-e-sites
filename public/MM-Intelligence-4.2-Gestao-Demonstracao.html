const I=(name,n=18)=>`<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.info}</svg>`;
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDate=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>localDate(new Date());
const offset=(d)=>{const a=new Date();a.setDate(a.getDate()+d);return localDate(a)};
const money=(n)=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);
const dateBR=(s)=>s?String(s).slice(0,10).split('-').reverse().join('/'):'—';
const number=(v)=>{if(typeof v==='string'&&v.includes(','))v=v.replaceAll('.','').replace(',','.');return Number(v)};
const id=()=>('id-'+Math.random().toString(36).slice(2,9));
const agents={atlas:{name:'Atlas',job:'Estratégia & operações',symbol:'✦',color:'#5fa6ff',bg:'#eaf3ff',detail:'Organiza suas prioridades e transforma informações em decisões.'},max:{name:'Max',job:'Vendas & marketplaces',symbol:'↗',color:'#ec9854',bg:'#fff2e8',detail:'Analisa pedidos, desempenho comercial e oportunidades.'},luna:{name:'Luna',job:'Financeiro & resultados',symbol:'◈',color:'#13a98c',bg:'#e5f8f2',detail:'Ajuda a separar recebimentos, despesas e margem.'},nexa:{name:'Nexa',job:'Produtos & estoque',symbol:'⬡',color:'#9461d1',bg:'#f4ecfe',detail:'Prioriza reposição e organização de produtos.'},vega:{name:'Vega',job:'Marketing & anúncios',symbol:'✺',color:'#ee568f',bg:'#fff0f7',detail:'Ajuda a analisar investimento publicitário e oportunidades de conversão.'},price:{name:'Price',job:'Precificação & concorrência',symbol:'◉',color:'#d38a16',bg:'#fff6df',detail:'Simula preço mínimo protegido e ajuda a comparar referências competitivas informadas manualmente.'}};
const views=[['inicio','Meu dia','dashboard'],['vendas','Vendas e pedidos','bag'],['financeiro','Financeiro','wallet'],['produtos','Produtos e estoque','box'],['clientes','Clientes e CRM','users'],['orcamentos','Serviços e orçamentos','clipboard'],['tarefas','Tarefas e agenda','check'],['relatorios','Relatórios','chart'],['precificacao','Price · Precificação','trend'],['ia','Sala da IA','brain'],['config','Meu ambiente','settings']];
function initial(profile){
const p=[{id:'p1',sku:'ISO-WF-900',name:'Iso Fit Wefit 900g',stock:13,min:18,cost:76,price:129.9},{id:'p2',sku:'CREA-300',name:'Creatina 300g',stock:39,min:15,cost:34,price:69.9},{id:'p3',sku:'WHEY-1K',name:'Creamy Whey 1kg',stock:7,min:12,cost:61,price:109.9},{id:'p4',sku:'COQ10-60',name:'CoQ10 60 cápsulas',stock:28,min:10,cost:45,price:89.9}];
const c=[{id:'c1',name:'Ana Oliveira',email:'ana@exemplo.com',phone:'(16) 99999-0000',stage:'Cliente'},{id:'c2',name:'Carlos Mendes',email:'carlos@exemplo.com',phone:'',stage:'Proposta'},{id:'c3',name:'Mariana Lopes',email:'',phone:'',stage:'Cliente'}];
const sales=[{id:'s1',code:'ML-1018',date:offset(-1),client:'Ana Oliveira',channel:'Mercado Livre',items:[{productId:'p1',qty:2,price:129.9,cost:76}],fees:35,shipping:12,discount:0,ads:5,status:'concluida'},{id:'s2',code:'SH-1019',date:offset(-2),client:'Mariana Lopes',channel:'Shopee',items:[{productId:'p2',qty:3,price:69.9,cost:34}],fees:27,shipping:7,discount:0,ads:6,status:'concluida'},{id:'s3',code:'TT-1020',date:offset(-3),client:'Carlos Mendes',channel:'TikTok Shop',items:[{productId:'p3',qty:1,price:109.9,cost:61}],fees:14,shipping:6,discount:0,ads:4,status:'cancelada'}];
const ledger=[{id:'f1',desc:'Pagamento fornecedor',type:'saida',amount:360,due:offset(-2),paid:false,category:'Fornecedores'},{id:'f2',desc:'Repasse marketplace',type:'entrada',amount:847.5,due:offset(2),paid:false,category:'Vendas'},{id:'f3',desc:'Aluguel',type:'saida',amount:900,due:offset(6),paid:false,category:'Fixo'},{id:'f4',desc:'Serviço de fotografia',type:'entrada',amount:450,due:offset(-4),paid:true,category:'Serviços'}];
const quotes=[{id:'q1',client:'Carlos Mendes',title:'Criação de identidade visual',amount:1250,status:'enviado',due:offset(4)},{id:'q2',client:'Ana Oliveira',title:'Consultoria de operação',amount:650,status:'aprovado',due:offset(8)}];
const tasks=[{id:'t1',title:'Conferir o repasse da loja',done:false,due:offset(0),agent:'luna',priority:'alta'},{id:'t2',title:'Repor Iso Fit e Creamy Whey',done:false,due:offset(1),agent:'nexa',priority:'alta'},{id:'t3',title:'Retornar proposta de Carlos',done:false,due:offset(-1),agent:'max',priority:'normal'}];
const base={products:p,clients:c,sales,ledger,quotes,tasks,chat:{atlas:[],max:[],luna:[],nexa:[],vega:[],price:[]},activity:[],profile};
if(profile==='servicos'){base.products=[];base.sales=[];base.ledger=[{id:'f5',desc:'Projeto de design — cliente Ana',type:'entrada',amount:1500,due:offset(2),paid:false,category:'Serviços'},{id:'f6',desc:'Assinatura de ferramenta',type:'saida',amount:109,due:offset(4),paid:false,category:'Tecnologia'},{id:'f7',desc:'Consultoria recebida',type:'entrada',amount:750,due:offset(-3),paid:true,category:'Serviços'}];base.tasks=[{id:'t4',title:'Enviar orçamento para Carlos',done:false,due:offset(0),agent:'max',priority:'alta'},{id:'t5',title:'Cobrar pagamento do projeto Ana',done:false,due:offset(-1),agent:'luna',priority:'alta'}];}
if(profile==='hibrido'){base.quotes.push({id:'q3',client:'Mariana Lopes',title:'Treinamento de equipe comercial',amount:980,status:'rascunho',due:offset(14)});}

let profile='ecommerce';let store={};let theme='light',displayName='Usuário de demonstração',profilePhoto='';let priceProduct='',priceFields={current:79.9,cost:42,fee:15,tax:5,ads:3,freight:9,fixed:0,margin:8,comp:'',url:''};let page='inicio',search='',agent='atlas',aiTab='office',mobileMenu=false,salesDraft=[],quickSource='';
function storageKey(x){return KEY+'-'+x}
function load(x){try{const t=localStorage.getItem(storageKey(x));if(t){const obj=JSON.parse(t);if(obj&&Array.isArray(obj.products)&&Array.isArray(obj.sales)){obj.chat=obj.chat||{};for(const k in agents)obj.chat[k]??=[];obj.priceRefs??={};return obj}}}catch{}const seed=initial(x);seed.priceRefs={};return seed}
function save(){try{localStorage.setItem(storageKey(profile),JSON.stringify(store))}catch{toast('Não foi possível salvar neste navegador. Exporte seus dados antes de sair.')}}
function toast(t){const n=document.getElementById('toast');n.textContent=t;n.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>n.classList.remove('show'),3700)}
function switchProfile(x){if(!['ecommerce','servicos','hibrido'].includes(x))return;profile=x;store=load(x);page='inicio';search='';aiTab='office';try{localStorage.setItem(KEY+'-active',x)}catch{}render();toast('Perfil alterado. Os dados demonstrativos são separados por tipo de negócio.')}
function totalSale(s){return s.items.reduce((v,it)=>v+Number(it.qty)*Number(it.price),0)-Number(s.discount||0)}
function saleCost(s){return s.items.reduce((v,it)=>v+Number(it.qty)*Number(it.cost),0)}
function contribution(s){return totalSale(s)-saleCost(s)-Number(s.fees||0)-Number(s.shipping||0)-Number(s.ads||0)}
function activeSales(){return store.sales.filter(s=>s.status!=='cancelada')}
function sums(){const sales=activeSales();const todayS=today();return {gross:sales.reduce((v,s)=>v+totalSale(s),0),contribution:sales.reduce((v,s)=>v+contribution(s),0),receivable:store.ledger.filter(x=>x.type==='entrada'&&!x.paid).reduce((v,x)=>v+x.amount,0),payable:store.ledger.filter(x=>x.type==='saida'&&!x.paid).reduce((v,x)=>v+x.amount,0),cash:store.ledger.filter(x=>x.paid).reduce((v,x)=>v+(x.type==='entrada'?1:-1)*x.amount,0),low:store.products.filter(p=>p.stock<=p.min),late:store.ledger.filter(x=>!x.paid&&x.due<todayS),lateTasks:store.tasks.filter(x=>!x.done&&x.due<todayS),openTasks:store.tasks.filter(x=>!x.done).length,quotes:store.quotes.filter(x=>x.status!=='recusado').length,salesCount:sales.length}}
function heading(title,subtitle,actions='',tag='CENTRAL DE CONTROLE'){return `<div class="mm-page-heading"><div><div class="mm-eyebrow">${esc(tag)}</div><h1>${title}</h1><p>${subtitle}</p></div><div class="mm-heading-actions">${actions}</div></div>`}
function cardTitle(t,sub='',extra=''){return `<div class="mm-card-head"><div><h2>${t}</h2><p>${sub}</p></div>${extra}</div>`}
function kpi(label,val,iconName,sub,cls=''){return `<article class="mm-card mm-kpi ${cls}"><div class="mm-kpi-top">${esc(label)}<span class="mm-kpi-icon">${I(iconName,17)}</span></div><strong class="mm-kpi-value">${val}</strong><div class="mm-kpi-sub">${sub}</div></article>`}
function btn(txt,action,value='',kind=''){return `<button type="button" class="mm-btn ${kind}" data-action="${action}" data-id="${esc(value)}">${txt}</button>`}
function shell(){const enabled=views.filter(v=>profile!=='servicos'||v[0]!=='produtos');return `<div class="mm-shell"><aside class="mm-sidebar ${mobileMenu?'open':''}"><a class="mm-brand" href="#inicio" data-nav="inicio"><span class="mm-brand-logo">M<i>.</i></span><span class="mm-brand-copy"><strong>MM Intelligence</strong><small>BUSINESS OPERATING SYSTEM</small></span></a><div class="mm-navsection">AMBIENTE DE TRABALHO</div><div class="mm-nav">${enabled.map(([id,label,ico])=>`<button type="button" data-nav="${id}" class="${page===id?'active':''}">${I(ico)} ${label}${id==='ia'?'<b>AI</b>':''}${id==='tarefas'&&sums().openTasks?`<span class="mm-count">${sums().openTasks}</span>`:''}</button>`).join('')}</div><div class="mm-side-bottom"><div class="mm-side-ai"><small>✦ SEU TIME DIGITAL</small><strong>6 especialistas para ajudar</strong><p>Atlas, Max, Luna, Nexa, Vega e Price ajudam você a organizar o próximo passo.</p><button data-nav="ia">Conhecer a Sala da IA →</button></div><div class="mm-side-label">${I('shield',14)} Prévia sem login ou API real</div></div></aside><button aria-label="Fechar menu" class="mm-sidebar-cover ${mobileMenu?'open':''}" data-action="menu"></button><div class="mm-main"><header class="mm-topbar"><button class="mm-mobiletoggle" aria-label="Abrir menu" data-action="menu">${I('menu',22)}</button><div class="mm-breadcrumb">MM Intelligence ${I('chevron',13)} <strong>${esc(views.find(v=>v[0]===page)?.[1]||'Meu dia')}</strong></div><div class="mm-top-actions"><button type="button" class="mm41-search-button" data-action="open-command" aria-label="Buscar no sistema" title="Busca rápida (Ctrl+K)">${I('search',17)}<span>Buscar</span><kbd>Ctrl K</kbd></button><span class="mm-pill">${I('shield',13)} Modo demonstração</span><div class="mm4-clock" aria-label="Data e hora"><b id="mm4-clock-time">--:--</b><small id="mm4-clock-date">Horário local</small></div><button class="mm4-theme-toggle" data-action="theme" title="Alternar modo noturno e claro" aria-label="Alternar modo noturno e claro">${theme==='dark'?'☀':'☾'}<span>${theme==='dark'?'Modo claro':'Modo noturno'}</span></button><button class="mm4-user" data-action="profile-modal" aria-label="Editar meu perfil"><span class="mm4-user-avatar">${profilePhoto?`<img src="${profilePhoto}" alt="Foto de perfil">`:esc(displayName[0]||'U').toUpperCase()}</span><span class="mm4-user-copy"><b>${esc(displayName)}</b><small>Conta demonstrativa</small></span>⌄</button></div></header><div class="mm-content"><div class="mm-demo-banner">${I('info',17)} <div><b>AMBIENTE DEMONSTRATIVO</b> — Todos os números e personagens são fictícios. Alterações ficam somente no navegador. Não há integração real, cobrança ou execução automática de IA.</div></div>${viewContent()}<footer class="mm-footer"><span>MM Intelligence 4.1 · Protótipo navegável · ${esc(profile==='ecommerce'?'Perfil e-commerce':profile==='servicos'?'Perfil autônomo':'Perfil híbrido')}</span><span>Feito para testar a experiência, não para operações financeiras reais. <span>Sem conexão com produção</span></span></footer></div></div><nav class="mm-mobilebar" aria-label="Acesso rápido">${[['inicio','dashboard','Início'],['financeiro','wallet','Finanças'],['ia','brain','Sala IA'],['tarefas','check','Tarefas'],['config','settings','Perfil']].map(([id,ic,t])=>`<button class="${page===id?'active':''}" data-nav="${id}">${I(ic,18)}${t}</button>`).join('')}</nav></div>`}
function priorities(){const s=sums();let r=[];if(s.late.length)r.push({title:`${s.late.length} conta(s) vencida(s)`,desc:'Confira pagamentos ou cobranças pendentes.',kind:'danger',icon:'wallet',target:'financeiro'});if(s.low.length)r.push({title:`${s.low.length} produto(s) abaixo do mínimo`,desc:'Priorize a reposição e valide o saldo real.',kind:'warning',icon:'box',target:'produtos'});if(s.lateTasks.length)r.push({title:`${s.lateTasks.length} tarefa(s) atrasada(s)`,desc:'Reorganize os prazos do seu trabalho.',kind:'warning',icon:'calendar',target:'tarefas'});if(store.quotes.some(q=>q.status==='enviado'))r.push({title:'Orçamentos aguardando resposta',desc:'Retome as oportunidades ainda em negociação.',kind:'',icon:'clipboard',target:'orcamentos'});if(!r.length)r.push({title:'Tudo organizado por enquanto',desc:'Continue cadastrando dados para acompanhar suas prioridades.',kind:'',icon:'check',target:'tarefas'});return r;}
function renderPriorities(){return `<div class="mm-priority-list">${priorities().map(r=>`<div class="mm-priority ${r.kind}"><span class="mm-priority-ico">${I(r.icon,18)}</span><div class="mm-priority-text"><strong>${esc(r.title)}</strong><small>${esc(r.desc)}</small></div><button data-nav="${r.target}">Ver detalhes →</button></div>`).join('')}</div>`}
function dashboard(){const s=sums();const title=profile==='servicos'?'Sua rotina começa por aqui':profile==='hibrido'?'Visão completa do seu negócio':'Seu negócio começa por aqui';return `${heading(title+'<span>.</span>','Seus indicadores, pendências e próximas ações em uma tela.',`${btn(`${I('plus',15)} Novo registro`,'new','financeiro','mm-btn-primary')}${btn(`${I('refresh',15)} Restaurar exemplo`,'reset','','')}`)}<div class="mm-kpis">${kpi('VENDAS NÃO CANCELADAS',money(s.gross),'bag','Pedidos cadastrados na demonstração')}${kpi('A RECEBER',money(s.receivable),'wallet','Lançamentos pendentes · não soma vendas','mm-kpi-mint')}${kpi('A PAGAR',money(s.payable),'calendar','Obrigações ainda não quitadas','mm-kpi-amber')}${kpi('TAREFAS EM ABERTO',s.openTasks,'check',`${s.lateTasks.length} atrasada(s) · revisar prazos`,'mm-kpi-purple')}</div><div class="mm-cols"><section class="mm-card mm-card-pad">${cardTitle('O que merece sua atenção?','Prioridades construídas a partir dos dados fictícios.',`<button data-nav="tarefas">Abrir tarefas →</button>`)}${renderPriorities()}</section><section class="mm-card mm-feature-ai"><span class="tag">✦ MM ARTIFICIAL INTELLIGENCE</span><h2>Um time digital<br/><em>ao seu lado.</em></h2><p>Entre na Sala da IA, converse com um especialista e transforme diagnósticos em missões para sua empresa.</p><div class="mm-mini-agents"><span>✦</span><span>↗</span><span>◈</span><span>⬡</span><span>✺</span><span>◉</span></div><button data-nav="ia">Entrar na Sala da IA →</button></section></div><div class="mm-cols mm-cols-even"><section class="mm-card mm-card-pad">${cardTitle('Movimentação dos pedidos','Amostra fictícia sem recorte mensal automático.',`<button data-nav="vendas">Ver pedidos →</button>`)}${chartSales()}</section><section class="mm-card mm-card-pad">${cardTitle('Próximas tarefas','Conclua ou reabra missões manualmente.',`<button data-nav="tarefas">Ver todas →</button>`)}${taskRows(4)}</section></div><div class="mm-note">${I('info',15)} A contribuição estimada por venda exclui impostos e outras despesas não cadastradas. Não corresponde a lucro contábil nem ao saldo de caixa.</div>`}
function chartSales(){const days=[-5,-4,-3,-2,-1,0];let data=days.map(d=>{const day=offset(d);return store.sales.filter(s=>s.date===day&&s.status!=='cancelada').reduce((v,s)=>v+totalSale(s),0)});let max=Math.max(...data,100);return `<div class="mm-chart">${data.map((v,i)=>`<div class="mm-chart-col"><div class="mm-chart-bar" style="height:${Math.max(3,Math.round(v/max*160))}px" title="${money(v)}"></div><span class="mm-chart-label">${dateBR(offset(days[i])).slice(0,5)}</span></div>`).join('')}</div><div class="mm-stat-foot"><span>Últimos seis dias · vendas de exemplo</span><span>Somente não canceladas</span></div>`}
function taskRows(limit){const selected=store.tasks.filter(t=>!t.done).slice(0,limit);return selected.length?selected.map(t=>`<div class="mm-priority"><span class="mm-priority-ico">${I('check',17)}</span><div class="mm-priority-text"><strong>${esc(t.title)}</strong><small>${esc(agents[t.agent]?.name||'Equipe')} · ${dateBR(t.due)} · ${esc(t.priority)}</small></div><button data-action="task-toggle" data-id="${t.id}">Concluir</button></div>`).join(''):`<div class="mm-empty">${I('check',28)}<h3>Nenhuma tarefa em aberto</h3><p>Você pode adicionar uma nova missão.</p></div>`}
function badge(text,type=''){return `<span class="mm-badge ${type}">${esc(text)}</span>`}
function searchBar(placeholder='Pesquisar...'){return `<input class="mm-input mm-filter" id="list-search" type="search" value="${esc(search)}" placeholder="${esc(placeholder)}" aria-label="Filtrar registros">`}
function viewContent(){switch(page){case 'inicio':return dashboard();case 'vendas':return salesPage();case 'financeiro':return financePage();case 'produtos':return productsPage();case 'clientes':return clientsPage();case 'orcamentos':return quotesPage();case 'tarefas':return tasksPage();case 'relatorios':return reportsPage();case 'precificacao':return pricingPage();case 'ia':return aiPage();case 'config':return configPage();default:return dashboard();}}
function salesPage(){const s=sums();const items=store.sales.filter(x=>(x.code+x.client+x.channel).toLowerCase().includes(search.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));return `${heading('Vendas & pedidos','Controle simples de pedidos, itens e margem de contribuição estimada.',`${btn(`${I('download',15)} Exportar CSV`,'export','sales')}${btn(`${I('plus',15)} Nova venda`,'new','sales','mm-btn-primary')}`,'OPERAÇÃO COMERCIAL')}<div class="mm-kpis">${kpi('VENDAS BRUTAS',money(s.gross),'bag','Somente pedidos não cancelados')}${kpi('CONTRIBUIÇÃO ESTIMADA',money(s.contribution),'trend','Antes de impostos e despesas gerais','mm-kpi-mint')}${kpi('PEDIDOS VÁLIDOS',String(s.salesCount),'clipboard','Exclui cancelamentos')}${kpi('CANCELAMENTOS',String(store.sales.length-s.salesCount),'info','Não entram no faturamento','mm-kpi-amber')}</div><section class="mm-card"><div class="mm-card-pad">${cardTitle('Pedidos cadastrados','Clique em detalhes para ver composição da contribuição.')}<div class="mm-section-tools">${searchBar('Pedido, cliente ou canal')}<span class="mm-spacer"></span>${btn('Importar CSV','import','sales')}</div></div><div class="mm-table-wrap"><table class="mm-table"><thead><tr><th>Pedido</th><th>Cliente / Canal</th><th>Situação</th><th>Valor da venda</th><th>Contribuição*</th><th>Ações</th></tr></thead><tbody>${items.map(s=>`<tr><td><b>${esc(s.code)}</b><span class="sub">${dateBR(s.date)}</span></td><td>${esc(s.client)}<span class="sub">${esc(s.channel)}</span></td><td>${badge(s.status==='cancelada'?'Cancelado':'Concluído',s.status==='cancelada'?'danger':'success')}</td><td>${money(totalSale(s))}</td><td>${s.status==='cancelada'?'—':money(contribution(s))}</td><td><div class="mm-row-actions">${btn('Ver','details',s.id,'mm-btn-small')}${s.status!=='cancelada'?btn('CAN','cancel',s.id,'mm-btn-small'):''}</div></td></tr>`).join('')}</tbody></table></div>${!items.length?empty('Nenhum pedido encontrado','Registre uma venda para começar.') :''}</section><div class="mm-note">${I('info',15)} *Contribuição = valor dos itens − descontos − custo direto − taxas − frete suportado − publicidade informada. Não inclui impostos, custos fixos nem repasses reais. Pedidos cancelados não têm contribuição realizada.</div>`}
function financePage(){const s=sums(),rows=store.ledger.filter(x=>(x.desc+x.category).toLowerCase().includes(search.toLowerCase())).sort((a,b)=>a.due.localeCompare(b.due));return `${heading('Financeiro sem confusão','Separe contas a receber, a pagar e valores efetivamente pagos.',`${btn(`${I('download',15)} Exportar CSV`,'export','finance')}${btn(`${I('plus',15)} Novo lançamento`,'new','financeiro','mm-btn-primary')}`,'CONTROLE FINANCEIRO')}<div class="mm-kpis">${kpi('A RECEBER',money(s.receivable),'wallet','Valores pendentes de entrada','mm-kpi-mint')}${kpi('A PAGAR',money(s.payable),'calendar','Valores pendentes de saída','mm-kpi-amber')}${kpi('CAIXA DESTE CONTROLE',money(s.cash),'chart','Somente lançamentos marcados pagos')}${kpi('CONTAS VENCIDAS',String(s.late.length),'info','Requerem conferência','mm-kpi-purple')}</div><div class="mm-cols"><section class="mm-card mm-card-pad">${cardTitle('Lançamentos financeiros','Controle manual, independente das vendas.')}<div class="mm-section-tools">${searchBar('Descrição ou categoria')}</div><div class="mm-table-wrap"><table class="mm-table"><thead><tr><th>Descrição</th><th>Vencimento</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.desc)}</b><span class="sub">${esc(x.category)}</span></td><td>${dateBR(x.due)}</td><td>${x.type==='entrada'?'+':'−'} ${money(x.amount)}</td><td>${badge(x.paid?'Pago':x.due<today()?'Vencido':'Pendente',x.paid?'success':x.due<today()?'danger':'warning')}</td><td><div class="mm-row-actions">${btn(x.paid?'Reabrir':'Marcar pago','finance-toggle',x.id,'mm-btn-small')}</div></td></tr>`).join('')}</tbody></table></div>${!rows.length?empty('Sem lançamentos','Adicione um registro financeiro.') :''}</section><aside class="mm-tipbox"><strong>Como interpretar os valores?</strong>O total a receber reúne lançamentos pendentes. O caixa considera apenas lançamentos pagos, nesta demonstração.<br><br>Vendas cadastradas não são duplicadas automaticamente como recebimentos. Para um sistema comercial, será necessária conciliação bancária e de marketplaces.<br><br><b>Próximo passo:</b> comparar datas de venda, previsão de repasse e recebimento real.</aside></div>`}
function productsPage(){const items=store.products.filter(x=>(x.name+x.sku).toLowerCase().includes(search.toLowerCase()));return `${heading('Produtos & estoque','Cadastre seus produtos e acompanhe alertas sem perder a visão do custo.',`${btn(`${I('download',15)} Exportar CSV`,'export','products')}${btn(`${I('plus',15)} Novo produto`,'new','products','mm-btn-primary')}`,'CATÁLOGO & REPOSIÇÃO')}<div class="mm-kpis">${kpi('PRODUTOS CADASTRADOS',store.products.length,'box','SKUs do exemplo')}${kpi('ESTOQUE TOTAL',store.products.reduce((v,p)=>v+p.stock,0),'store','Unidades no saldo manual')}${kpi('ABAIXO DO MÍNIMO',sums().low.length,'info','Itens que exigem revisão','mm-kpi-amber')}${kpi('VALOR DE CUSTO',money(store.products.reduce((v,p)=>v+p.stock*p.cost,0)),'wallet','Estimativa de estoque × custo','mm-kpi-mint')}</div><section class="mm-card"><div class="mm-card-pad">${cardTitle('Seu catálogo','Unidades fictícias: não representam estoques Full ou de outros CDs.')}<div class="mm-section-tools">${searchBar('Produto ou SKU')}</div></div><div class="mm-table-wrap"><table class="mm-table"><thead><tr><th>Produto / SKU</th><th>Custo</th><th>Preço</th><th>Saldo</th><th>Alerta</th><th></th></tr></thead><tbody>${items.map(p=>`<tr><td><b>${esc(p.name)}</b><span class="sub">${esc(p.sku)}</span></td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${p.stock} un.</td><td>${badge(p.stock<=p.min?'Repor':'Dentro do mínimo',p.stock<=p.min?'warning':'success')}</td><td><div class="mm-row-actions">${btn('Ajustar','stock',p.id,'mm-btn-small')}${btn('Editar','edit-product',p.id,'mm-btn-small')}</div></td></tr>`).join('')}</tbody></table></div>${!items.length?empty('Nenhum produto','Cadastre um SKU para começar.') :''}</section><div class="mm-note">${I('info',15)} Ajustes manuais geram eventos de demonstração. Estoque por depósito, inventário, kits e movimentação auditável requerem backend transacional.</div>`}
function clientsPage(){const rows=store.clients.filter(x=>(x.name+x.email+x.stage).toLowerCase().includes(search.toLowerCase()));return `${heading('Clientes & relacionamento','Não perca oportunidades de orçamento, venda e atendimento.',`${btn(`${I('plus',15)} Novo cliente`,'new','clients','mm-btn-primary')}`,'CRM SIMPLES')}<div class="mm-kpis">${kpi('CONTATOS',store.clients.length,'users','Clientes e leads')}${kpi('EM PROPOSTA',store.clients.filter(c=>c.stage==='Proposta').length,'clipboard','Acompanhar negociações','mm-kpi-amber')}${kpi('CLIENTES',store.clients.filter(c=>c.stage==='Cliente').length,'check','Relacionamentos ativos','mm-kpi-mint')}${kpi('ORÇAMENTOS',store.quotes.length,'file','Propostas cadastradas','mm-kpi-purple')}</div><section class="mm-card"><div class="mm-card-pad">${cardTitle('Seus contatos','Relacionamento organizado em uma única lista.')}<div class="mm-section-tools">${searchBar('Nome, e-mail ou etapa')}</div></div><div class="mm-table-wrap"><table class="mm-table"><thead><tr><th>Nome</th><th>Contato</th><th>Etapa</th><th>Ação</th></tr></thead><tbody>${rows.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.email||c.phone||'Não informado')}</td><td>${badge(c.stage,c.stage==='Cliente'?'success':c.stage==='Proposta'?'warning':'')}</td><td>${btn('Editar','edit-client',c.id,'mm-btn-small')}</td></tr>`).join('')}</tbody></table></div>${!rows.length?empty('Nenhum contato','Cadastre um cliente para começar.') :''}</section>`}
function quotesPage(){const rows=store.quotes.filter(x=>(x.client+x.title+x.status).toLowerCase().includes(search.toLowerCase()));return `${heading('Serviços & orçamentos','Da primeira proposta ao acompanhamento do cliente.',`${btn(`${I('plus',15)} Novo orçamento`,'new','quotes','mm-btn-primary')}`,'SERVIÇOS')}<div class="mm-kpis">${kpi('ORÇAMENTOS',store.quotes.length,'clipboard','Total cadastrado')}${kpi('EM NEGOCIAÇÃO',store.quotes.filter(q=>q.status==='enviado').length,'clock','Aguardam retorno','mm-kpi-amber')}${kpi('APROVADOS',store.quotes.filter(q=>q.status==='aprovado').length,'check','Propostas aprovadas','mm-kpi-mint')}${kpi('VALOR EM PROPOSTAS',money(store.quotes.filter(x=>x.status==='enviado').reduce((v,x)=>v+x.amount,0)),'wallet','Não é receita realizada')}</div><section class="mm-card"><div class="mm-card-pad">${cardTitle('Orçamentos cadastrados','A aprovação não cria recebimento automaticamente.')}<div class="mm-section-tools">${searchBar('Cliente ou serviço')}</div></div><div class="mm-table-wrap"><table class="mm-table"><thead><tr><th>Cliente / Serviço</th><th>Previsão</th><th>Valor</th><th>Etapa</th><th>Ações</th></tr></thead><tbody>${rows.map(q=>`<tr><td><b>${esc(q.client)}</b><span class="sub">${esc(q.title)}</span></td><td>${dateBR(q.due)}</td><td>${money(q.amount)}</td><td>${badge(q.status,q.status==='aprovado'?'success':q.status==='enviado'?'warning':'')}</td><td><div class="mm-row-actions">${btn('Editar','edit-quote',q.id,'mm-btn-small')}${btn('Imprimir','print-quote',q.id,'mm-btn-small')}</div></td></tr>`).join('')}</tbody></table></div>${!rows.length?empty('Nenhum orçamento','Crie sua primeira proposta.') :''}</section>`}
function tasksPage(){const open=store.tasks.filter(t=>!t.done),done=store.tasks.filter(t=>t.done);return `${heading('Tarefas & missões','Transforme prioridades em ações organizadas com prazos e responsáveis.',`${btn(`${I('plus',15)} Nova tarefa`,'new','tasks','mm-btn-primary')}`,'ORGANIZAÇÃO')}<div class="mm-cols mm-cols-even"><section class="mm-card mm-card-pad">${cardTitle(`A fazer · ${open.length}`,'Concluir é sempre uma ação manual.')}${open.map(t=>taskItem(t)).join('')||empty('Tudo em dia','Não existem tarefas pendentes.')}</section><section class="mm-card mm-card-pad">${cardTitle(`Concluídas · ${done.length}`,'Histórico das ações registradas.')}${done.map(t=>taskItem(t)).join('')||empty('Ainda sem tarefas concluídas','Você pode concluir uma missão do quadro.')}</section></div>`}
function taskItem(t){return `<div class="mm-mission ${t.done?'is-done':''}"><input type="checkbox" aria-label="${esc(t.done?'Reabrir':'Concluir')} ${esc(t.title)}" data-action="task-toggle" data-id="${t.id}" ${t.done?'checked':''}><label data-action="task-toggle" data-id="${t.id}"><strong>${esc(t.title)}</strong><small>${esc(agents[t.agent]?.name||'Equipe')} · ${dateBR(t.due)} · ${esc(t.priority)}</small></label><button data-action="delete-task" data-id="${t.id}" aria-label="Remover tarefa">${I('trash',14)}</button></div>`}
function reportsPage(){const s=sums(),by={};activeSales().forEach(x=>{by[x.channel]??={orders:0,gross:0,contrib:0};by[x.channel].orders++;by[x.channel].gross+=totalSale(x);by[x.channel].contrib+=contribution(x)});return `${heading('Relatórios que explicam','Veja os cálculos, a origem dos dados e o que ainda está fora do resultado.',`${btn(`${I('download',15)} Exportar pedidos`,'export','sales')}`,'INTELIGÊNCIA DE NEGÓCIO')}<div class="mm-kpis">${kpi('FATURAMENTO BRUTO',money(s.gross),'bag','Pedidos não cancelados')}${kpi('CONTRIBUIÇÃO DIRETA',money(s.contribution),'chart','Antes de tributos e fixos')}${kpi('CANCELAMENTOS',store.sales.length-s.salesCount,'info','Não contabilizados')}${kpi('A RECEBER',money(s.receivable),'wallet','Lançamentos financeiros separados')}</div><div class="mm-cols"><section class="mm-card mm-card-pad">${cardTitle('Vendas por canal','Agrupamento dos pedidos demonstrativos.')}<div class="mm-table-wrap"><table class="mm-table"><thead><tr><th>Canal</th><th>Pedidos</th><th>Bruto</th><th>Contribuição*</th></tr></thead><tbody>${Object.entries(by).map(([key,val])=>`<tr><td><b>${esc(key)}</b></td><td>${val.orders}</td><td>${money(val.gross)}</td><td>${money(val.contrib)}</td></tr>`).join('')}</tbody></table></div>${!Object.keys(by).length?empty('Sem vendas para analisar','Cadastre vendas para liberar a visão por canal.') :''}</section><aside class="mm-tipbox"><strong>Como confiar nos números?</strong>Este demonstrativo diferencia faturamento, contribuição estimada e caixa financeiro. Não há conciliação de repasses, tributos, chargebacks, competência ou despesas gerais.<br><br><b>Antes de usar comercialmente:</b> integrar pedidos e itens, taxas, impostos, custos por SKU e pagamentos.</aside></div>`}
function pricingPage(){const items=store.products||[],ref=store.priceRefs?.[priceProduct||'_avulso']||null;return `${heading('Price · Precificação inteligente','Simule um preço mínimo com margem protegida e compare uma referência concorrente informada manualmente.',`${btn(`${I('info',15)} Entender cálculo`,'price-explain')}`,'INTELIGÊNCIA COMPETITIVA')}<div class="mm4-price-grid"><section class="mm-card mm-card-pad">${cardTitle('Analisar produto e concorrente','Nenhuma alteração de preço será enviada aos marketplaces.')}<div class="mm4-price-info">✦ O Price analisa os custos informados e a referência manual. Sem consulta automática a concorrentes nesta demonstração.</div><div class="mm-field"><label for="price-product">Produto do seu catálogo</label><select class="mm-input" id="price-product"><option value="">Simulação avulsa</option>${items.map(p=>`<option value="${esc(p.id)}" ${priceProduct===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="mm-formgrid"><div class="mm-field"><label for="price-current">Seu preço atual (R$)</label><input id="price-current" class="mm-input" type="number" min="0" step="0.01" value="${priceFields.current}"></div><div class="mm-field"><label for="price-cost">Custo do produto (R$)</label><input id="price-cost" class="mm-input" type="number" min="0" step="0.01" value="${priceFields.cost}"></div><div class="mm-field"><label for="price-fee">Comissão (%)</label><input id="price-fee" class="mm-input" type="number" min="0" max="100" step="0.01" value="${priceFields.fee}"></div><div class="mm-field"><label for="price-tax">Impostos estimados (%)</label><input id="price-tax" class="mm-input" type="number" min="0" max="100" step="0.01" value="${priceFields.tax}"></div><div class="mm-field"><label for="price-ads">Publicidade (% sobre a venda)</label><input id="price-ads" class="mm-input" type="number" min="0" max="100" step="0.01" value="${priceFields.ads}"></div><div class="mm-field"><label for="price-freight">Frete e embalagem (R$)</label><input id="price-freight" class="mm-input" type="number" min="0" step="0.01" value="${priceFields.freight}"></div><div class="mm-field"><label for="price-fixed">Tarifa fixa (R$)</label><input id="price-fixed" class="mm-input" type="number" min="0" step="0.01" value="${priceFields.fixed}"></div><div class="mm-field"><label for="price-margin">Margem mínima desejada (%)</label><input id="price-margin" class="mm-input" type="number" min="0" max="95" step="0.01" value="${priceFields.margin}"></div><div class="mm-field"><label for="price-comp">Preço concorrente (R$)</label><input id="price-comp" class="mm-input" type="number" min="0" step="0.01" value="${priceFields.comp||''}" placeholder="Informe manualmente"></div><div class="mm-field"><label for="price-url">Link concorrente (opcional)</label><input id="price-url" class="mm-input" type="url" maxlength="900" placeholder="https://..." value="${esc(priceFields.url)}"></div></div><div id="price-result" class="mm4-price-result">Calculando...</div><div class="mm4-price-save"><small>Referências manuais são gravadas apenas neste navegador, com data de registro.</small><button class="mm-btn mm-btn-primary" data-action="price-save" type="button">Registrar referência →</button></div></section><aside class="mm4-price-side"><div class="mm4-price-note"><strong>🛡 Margem protegida</strong><p>O menor preço nem sempre é o melhor. O Price só sugere acompanhar concorrentes que permitam preservar a margem mínima informada.</p></div><div class="mm4-price-note"><strong>🔎 Comparação correta</strong><p>Antes de aplicar o preço, confira gramatura, kit, frete, prazo, reputação, disponibilidade e descontos exclusivos.</p></div>${(store.priceHistory||[]).filter(r=>r.product===(priceProduct||'_avulso')).length?`<div class="mm4-price-note mm41-history"><strong>Histórico manual (${(store.priceHistory||[]).filter(r=>r.product===(priceProduct||'_avulso')).length})</strong><div class="mm41-history-list">${(store.priceHistory||[]).filter(r=>r.product===(priceProduct||'_avulso')).slice(0,5).map(r=>`<div><span>${money(r.comp)}</span><small>${esc(r.at)}</small>${r.url&&/^https?:\/\//.test(r.url)?`<a target="_blank" rel="noopener noreferrer" href="${esc(r.url)}" aria-label="Abrir referência concorrente">↗</a>`:''}</div>`).join('')}</div><small>Preços cadastrados manualmente, sem monitoramento externo.</small></div>`:''}${ref?`<div class="mm4-price-note"><strong>Última referência salva</strong><p>Preço: ${money(ref.comp||0)}<br>Registrado: ${esc(ref.at)}${ref.url&&/^https?:\/\//.test(ref.url)?`<br><a href="${esc(ref.url)}" target="_blank" rel="noopener noreferrer">Abrir anúncio ↗</a>`:''}</p></div>`:''}<div class="mm4-price-note"><strong>Integração futura</strong><p>Monitoramento automático somente por conectores oficiais ou fontes permitidas. Nenhuma cotação em tempo real é inventada.</p></div></aside></div>`}

function insightsList(){const s=sums(),list=[];if(s.late.length)list.push({agent:'luna',title:'Contas vencidas precisam de atenção',message:`Existem ${s.late.length} lançamentos vencidos que ainda não foram marcados como pagos.`,source:'Lançamentos financeiros demonstrativos',mission:'Conferir contas vencidas e registrar pagamentos'});if(s.low.length)list.push({agent:'nexa',title:'Produtos com estoque abaixo do mínimo',message:`${s.low.map(x=>x.name).join(', ')} exigem revisão de reposição.`,source:'Cadastro de produtos demonstrativos',mission:'Revisar reposição e estoque mínimo'});if(s.lateTasks.length)list.push({agent:'atlas',title:'Reorganizar tarefas atrasadas',message:`${s.lateTasks.length} tarefas estão atrasadas. Priorize os prazos antes de assumir novos compromissos.`,source:'Quadro de tarefas demonstrativo',mission:'Replanejar tarefas atrasadas'});if(store.quotes.some(q=>q.status==='enviado'))list.push({agent:'max',title:'Acompanhar propostas enviadas',message:'Há propostas em negociação que podem merecer contato de acompanhamento.',source:'Orçamentos demonstrativos',mission:'Retomar propostas aguardando resposta'});if(!list.length)list.push({agent:'atlas',title:'Manter a rotina organizada',message:'Não foram encontrados alertas críticos nesta amostra. Mantenha cadastros e lançamentos atualizados.',source:'Registros locais disponíveis',mission:'Revisar rotina desta semana'});return list}

 let created=0;
 for(const x of insightsList()){

 }
 if(created)addActivity(`Plano conjunto: ${created} missão(ões) criada(s).`);

function answerAgent(a,q){const s=sums();const l=q.toLowerCase();if(a==='price'||/precif|concorr|preço|margem mínima|price/i.test(l))return `Posso calcular preço mínimo e avaliar referências competitivas na seção Price · Precificação. Cadastre custo, frete, taxas, publicidade, margem mínima e o preço observado no concorrente. Não busco preços ao vivo nesta demonstração nem altero anúncios. Fonte: registros fictícios e dados informados manualmente.`;if(a==='vega'||/anúnci|ads|campanha/i.test(l))return 'Ainda não há dados de mídia conectados nesta demonstração. Vega recomenda acompanhar investimento, atribuição, TACOS e margem real por canal antes de escalar anúncios. Não inventarei métricas.';if(/cancelad|venda|pedido|fatur/i.test(l))return `Nesta demonstração há ${s.salesCount} pedidos não cancelados, somando ${money(s.gross)} em vendas brutas. A contribuição direta estimada é ${money(s.contribution)} antes de impostos e despesas gerais. Fonte: pedidos locais fictícios. Verifique a seção de Vendas para detalhes.`;if(/pagar|receb|caixa|lucro|finan|conta/i.test(l)||a==='luna')return `Nos lançamentos manuais: a receber ${money(s.receivable)}, a pagar ${money(s.payable)} e caixa registrado ${money(s.cash)}. Não é lucro contábil nem conciliação bancária. Fonte: financeiro local da demonstração.`;if(/estoque|repor|produto|sku|ruptur/i.test(l)||a==='nexa')return s.low.length?`Os itens abaixo do mínimo são: ${s.low.map(p=>`${p.name} (${p.stock} unidades; mínimo ${p.min})`).join('; ')}. Valide o estoque físico antes de comprar. Fonte: catálogo fictício.`:'Nenhum produto ficou abaixo do mínimo nos dados disponíveis. Isso não comprova cobertura de estoque: faltam vendas por período e prazos de fornecimento.';if(/orçament|cliente|proposta/i.test(l))return `Você tem ${store.clients.length} clientes cadastrados e ${store.quotes.filter(q=>q.status==='enviado').length} proposta(s) enviadas aguardando resposta. Fonte: CRM e orçamentos fictícios.`;return `Prioridades sugeridas com base no que existe na demonstração:\n${priorities().map((p,i)=>`${i+1}. ${p.title}. ${p.desc}`).join('\n')}\n\nTenho acesso somente aos registros fictícios desta sessão. Posso ajudar a transformar uma sugestão em missão, sem executar ações automaticamente.`}

function requirePositive(n,label,zeroAllowed=true){if(!Number.isFinite(n)||n<0||(!zeroAllowed&&n===0)||n>100000000)throw new Error(`Valor inválido para ${label}.`)}
function saveModal(e){e.preventDefault();const d=document.getElementById('editor');const f=new FormData(e.target),kind=d.dataset.kind,edit=d.dataset.editId;const get=(k)=>String(f.get(k)||'').trim();const num=(k)=>number(get(k));try{
if(kind==='financeiro'){requirePositive(num('amount'),'valor',false);const x={id:edit||id(),desc:get('desc'),type:get('type'),amount:num('amount'),category:get('category')||'Geral',due:get('due'),paid:false};if(!x.desc||!x.due)throw Error('Descrição e vencimento são obrigatórios.');store.ledger.push(x);addActivity('Lançamento financeiro cadastrado: '+x.desc)}
if(kind==='products'){for(let k of ['cost','price','stock','min'])requirePositive(num(k),k);if(!Number.isInteger(num('stock'))||!Number.isInteger(num('min')))throw Error('Estoque precisa ser um número inteiro.');if(!get('sku')||!get('name'))throw Error('SKU e nome são obrigatórios.');if(store.products.some(x=>x.sku.toLowerCase()===get('sku').toLowerCase()&&x.id!==edit))throw Error('Este SKU já está cadastrado.');const x={id:edit||id(),sku:get('sku'),name:get('name'),cost:num('cost'),price:num('price'),stock:num('stock'),min:num('min')};if(edit)store.products=store.products.map(p=>p.id===edit?x:p);else store.products.push(x);addActivity('Produto '+(edit?'editado':'cadastrado')+': '+x.name)}
if(kind==='clients'){if(!get('name'))throw Error('Informe o nome.');const x={id:edit||id(),name:get('name'),email:get('email'),phone:get('phone'),stage:get('stage')};if(edit)store.clients=store.clients.map(p=>p.id===edit?x:p);else store.clients.push(x);addActivity('Contato '+(edit?'editado':'cadastrado')+': '+x.name)}
if(kind==='quotes'){requirePositive(num('amount'),'valor da proposta',false);if(!get('client')||!get('title'))throw Error('Preencha o cliente e a descrição.');const x={id:edit||id(),client:get('client'),title:get('title'),amount:num('amount'),status:get('status'),due:get('due')};if(edit)store.quotes=store.quotes.map(p=>p.id===edit?x:p);else store.quotes.push(x);addActivity('Orçamento '+(edit?'atualizado':'criado')+': '+x.title)}
if(kind==='tasks'){if(get('title').length<3)throw Error('Escreva uma tarefa com pelo menos três caracteres.');store.tasks.unshift({id:id(),title:get('title'),agent:get('agent'),priority:get('priority'),due:get('due'),done:false});addActivity('Nova missão: '+get('title'))}
if(kind==='stock'){const x=store.products.find(p=>p.id===edit);if(!x)throw Error('Produto não encontrado.');requirePositive(num('qty'),'saldo');if(!Number.isInteger(num('qty')))throw Error('O saldo precisa ser inteiro.');const old=x.stock;x.stock=num('qty');addActivity(`Ajuste de ${x.name}: ${old} → ${x.stock} un. (${get('reason')})`)}
if(kind==='sales'){const p=store.products.find(p=>p.id===get('productId'));if(!p)throw Error('Selecione um produto válido.');for(let k of ['qty','unitPrice','fees','shipping','discount','ads'])requirePositive(num(k),k,k!=='qty');if(!Number.isInteger(num('qty')))throw Error('Quantidade precisa ser inteira.');if(num('qty')>p.stock)throw Error('Estoque insuficiente. Disponível: '+p.stock);if(store.sales.some(s=>s.code.toLowerCase()===get('code').toLowerCase()))throw Error('Número de pedido duplicado.');if(num('discount')>num('unitPrice')*num('qty'))throw Error('Desconto não pode superar o valor dos itens.');const x={id:id(),code:get('code'),date:get('date'),client:get('client')||'Consumidor final',channel:get('channel'),items:[{productId:p.id,qty:num('qty'),price:num('unitPrice'),cost:p.cost}],fees:num('fees'),shipping:num('shipping'),discount:num('discount'),ads:num('ads'),status:'concluida'};if(!x.code||!x.date)throw Error('Pedido e data são obrigatórios.');p.stock-=num('qty');store.sales.unshift(x);addActivity(`Venda cadastrada ${x.code}; baixa manual de ${num('qty')} unidade(s) em ${p.sku}.`)}
save();d.close();render();toast('Registro salvo com sucesso. Dados fictícios locais.');}catch(err){modalError(err.message||'Não foi possível salvar.')}}

function exportCSV(kind){const rows={sales:[['pedido','data','cliente','canal','status','valor_bruto','custo_direto','taxas','frete','desconto','ads','contribuicao_estimada'],...store.sales.map(s=>[s.code,s.date,s.client,s.channel,s.status,totalSale(s),saleCost(s),s.fees,s.shipping,s.discount,s.ads,s.status==='cancelada'?'':contribution(s)])],finance:[['descricao','tipo','categoria','valor','vencimento','pago'],...store.ledger.map(f=>[f.desc,f.type,f.category,f.amount,f.due,f.paid?'sim':'nao'])],products:[['sku','produto','custo','preco','estoque','minimo'],...store.products.map(p=>[p.sku,p.name,p.cost,p.price,p.stock,p.min])]}[kind];if(!rows){toast('Relatório não disponível.');return}const safe=(v)=>{const str=String(v??'');const secured=/^[\s]*[=+@\-\t\r]/.test(str)?"'"+str:str;return '"'+secured.replace(/"/g,'""')+'"'};const csv='\ufeff'+rows.map(row=>row.map(safe).join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mm-intelligence-demo-'+kind+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('CSV demonstrativo exportado.')}

function computePrice(){const el=document.getElementById('price-result');if(!el)return;const get=k=>Number(document.getElementById('price-'+k)?.value);const fields=['current','cost','fee','tax','ads','freight','fixed','margin','comp'];for(const k of fields){const node=document.getElementById('price-'+k);if(node)priceFields[k]=node.value===''&&k==='comp'?'':get(k)}priceFields.url=document.getElementById('price-url')?.value||'';const {current,cost,fee,tax,ads,freight,fixed,margin,comp}=priceFields;const nums=[current,cost,fee,tax,ads,freight,fixed,margin];const totalPct=Number(fee)+Number(tax)+Number(ads);const valid=nums.every(v=>Number.isFinite(Number(v))&&Number(v)>=0)&&margin<=95&&(totalPct+Number(margin))<100&&(comp===''||(Number.isFinite(Number(comp))&&Number(comp)>=0));if(!valid){el.innerHTML='<strong>Parâmetros incompatíveis</strong><p>Todos os custos precisam ser positivos e a soma das taxas com a margem deve ser menor que 100%.</p>';return}const min=Math.ceil(((Number(cost)+Number(freight)+Number(fixed))/(1-(totalPct+Number(margin))/100))*100)/100;const profit=Number(current)*(1-totalPct/100)-(Number(cost)+Number(freight)+Number(fixed));const marginReal=Number(current)>0?profit/Number(current)*100:null;const competitor=comp===''?null:Number(comp);let suggested=Number(current),reason='Sem referência concorrente: avalie seu preço e a margem calculada.';if(current<min){suggested=min;reason='Seu preço está abaixo do mínimo configurado. Ajuste para proteger a margem.';}else if(competitor!==null&&competitor>0){if(competitor<min){reason='Concorrente abaixo do seu mínimo: não recomendo acompanhar.';}else if(competitor<current){suggested=Math.max(min,Math.round((competitor-.01)*100)/100);reason='Preço próximo ao concorrente, sujeito a frete e condições equivalentes.';}else if(competitor>current*1.05){suggested=Math.min(competitor-.01,Math.round(current*1.05*100)/100);reason='Há espaço estimado para aumento gradual, acompanhando conversão.';}else reason='Preço próximo ao concorrente. Compare outras condições de venda.'}el.innerHTML=`<div class="mm4-price-result-grid"><div><small>PREÇO MÍNIMO</small><strong>${money(min)}</strong></div><div><small>MARGEM ATUAL ESTIMADA</small><strong class="${marginReal!==null&&marginReal<margin?'mm4-price-negative':''}">${marginReal===null?'—':marginReal.toFixed(1).replace('.',',')+'%'}</strong></div><div><small>CONTRIBUIÇÃO UNITÁRIA</small><strong>${money(profit)}</strong></div><div><small>PREÇO PARA TESTAR</small><strong>${money(suggested)}</strong></div></div><p>${esc(reason)}</p><small>Simulação: valores fictícios ou informados por você. Não inclui custos e descontos ausentes, nem garante Buy Box.</small>`}

window.addEventListener('message',e=>{if(e.data?.type==='MM_DEMO_AGENT_SELECTED'&&agents[e.data.agent]){agent=e.data.agent;aiTab='chat';render()}});
function importCSV(){const d=document.getElementById('editor');d.dataset.kind='import';document.getElementById('editor-body').innerHTML=`<div class="mm-modal-head"><h2 id="dialog-title">Importar pedidos por CSV</h2><button type="button" data-action="close-modal" aria-label="Fechar">×</button></div><div class="mm-modal-content"><div class="mm-tipbox"><strong>Formato da demonstração</strong>Cabeçalhos obrigatórios: <b>pedido;data;cliente;canal;sku;quantidade;preco;taxas;frete;desconto;ads</b><br><br>Uma linha por item; um pedido pode ter vários SKUs. Use números positivos e data AAAA-MM-DD. O estoque será baixado somente após conferência.</div><div class="mm-field" style="margin-top:18px"><label for="csv-file">Arquivo CSV (.csv)</label><input class="mm-input" type="file" id="csv-file" accept=".csv,text/csv"></div><div id="csv-result" style="margin-top:14px;font-size:11px;color:#647d92">Selecione um arquivo para conferir.</div></div><div class="mm-modal-footer"><button type="button" class="mm-btn" data-action="close-modal">Cancelar</button><button type="button" id="confirm-csv" class="mm-btn mm-btn-primary" disabled>Importar registros válidos</button></div>`;d.showModal();let valid=[];d.querySelector('#csv-file').addEventListener('change',async e=>{const file=e.target.files?.[0];valid=[];d.querySelector('#confirm-csv').disabled=true;if(!file)return;try{if(file.size>2e6)throw Error('Máximo de 2 MB nesta prévia.');const content=await file.text(),lines=csvRows(content);if(lines.length<2)throw Error('O arquivo não contém dados.');const keys=lines.shift().map(x=>x.toLowerCase().trim().replace(/^\ufeff/,''));const req=['pedido','data','cliente','canal','sku','quantidade','preco','taxas','frete','desconto','ads'];for(const k of req)if(!keys.includes(k))throw Error('Coluna ausente: '+k);const rows=lines.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(keys.map((key,i)=>[key,(r[i]??'').trim()])));const grouped=new Map();const rejectedOrders=new Set();let errors=[];for(let i=0;i<rows.length;i++){const r=rows[i];try{if(!/^\d{4}-\d{2}-\d{2}$/.test(r.data)||Number.isNaN(Date.parse(r.data)))throw Error('data inválida');const p=store.products.find(p=>p.sku.toLowerCase()===r.sku.toLowerCase());if(!p)throw Error('SKU não cadastrado');const qty=number(r.quantidade),price=number(r.preco),fees=number(r.taxas),shipping=number(r.frete),discount=number(r.desconto),ads=number(r.ads);for(const [v,label] of [[qty,'quantidade'],[price,'preço'],[fees,'taxas'],[shipping,'frete'],[discount,'desconto'],[ads,'ads']])requirePositive(v,label,label!=='quantidade');if(!Number.isInteger(qty))throw Error('quantidade deve ser inteira');if(store.sales.some(x=>x.code.toLowerCase()===r.pedido.toLowerCase()))throw Error('pedido já existente');const prior=grouped.get(r.pedido);if(prior&&[prior.date,prior.client,prior.channel].join('|')!==[r.data,r.cliente,r.canal].join('|'))throw Error('metadados divergentes para mesmo pedido');const x=prior||{id:id(),code:r.pedido,date:r.data,client:r.cliente||'Consumidor final',channel:r.canal||'Importação',items:[],fees:0,shipping:0,discount:0,ads:0,status:'concluida'};x.items.push({productId:p.id,qty,price,cost:p.cost});x.fees+=fees;x.shipping+=shipping;x.discount+=discount;x.ads+=ads;grouped.set(r.pedido,x)}catch(err){if(r.pedido)rejectedOrders.add(r.pedido);errors.push(`Linha ${i+2}: ${err.message}`)}}for(const rejected of rejectedOrders){if(grouped.delete(rejected))errors.push(`Pedido ${rejected}: nenhuma linha será importada porque o pedido contém erro.`)}let stockBalance=Object.fromEntries(store.products.map(p=>[p.id,p.stock]));for(const [k,s] of grouped){if(s.discount>s.items.reduce((v,it)=>v+it.qty*it.price,0)){errors.push('Pedido '+k+': desconto maior que valor dos itens.');grouped.delete(k);continue}if(s.items.some(it=>{stockBalance[it.productId]-=it.qty;return stockBalance[it.productId]<0})){errors.push('Pedido '+k+': estoque insuficiente.');grouped.delete(k);stockBalance=Object.fromEntries(store.products.map(p=>[p.id,p.stock]));for(const accepted of grouped.values())for(const it of accepted.items)stockBalance[it.productId]-=it.qty}}
valid=[...grouped.values()];d.querySelector('#csv-result').innerHTML=`<div class="mm-tipbox"><strong>Prévia da conferência</strong>${valid.length} pedido(s) válido(s) · ${errors.length} aviso(s) ou erro(s).<br>${errors.slice(0,8).map(esc).join('<br>')||'Nenhum erro identificado.'}</div>`;d.querySelector('#confirm-csv').disabled=!valid.length;}catch(err){d.querySelector('#csv-result').textContent=err.message}});d.querySelector('#confirm-csv').addEventListener('click',()=>{if(!valid.length)return;for(const s of valid){store.sales.unshift(s);for(const it of s.items){const p=store.products.find(x=>x.id===it.productId);if(p)p.stock-=it.qty}}addActivity(`Importação CSV: ${valid.length} pedido(s) adicionados.`);d.close();render();toast(`${valid.length} pedido(s) importado(s) após validação.`)})}
let commandMatches=[];
function commandSource(q){
 const items=[...views.map(([to,label])=>({to,label,sub:'Seção do sistema'})),
 ...store.products.map(x=>({to:'produtos',label:x.name,sub:'Produto · '+x.sku,term:x.name})),
 ...store.clients.map(x=>({to:'clientes',label:x.name,sub:'Cliente · '+(x.email||'Cadastro'),term:x.name})),
 ...store.sales.map(x=>({to:'vendas',label:x.code,sub:'Pedido · '+x.client,term:x.code})),
 ...store.tasks.map(x=>({to:'tarefas',label:x.title,sub:'Tarefa',term:''}))];
 const needle=q.trim().toLocaleLowerCase('pt-BR');
 return items.filter(x=>profile!=='servicos'||x.to!=='produtos').filter(x=>!needle||(x.label+' '+x.sub).toLocaleLowerCase('pt-BR').includes(needle)).slice(0,12);
}
function commandRender(q=''){
 const box=document.getElementById('mm41-command-results');
 if(!box)return;
 commandMatches=commandSource(q);
 box.innerHTML=commandMatches.length?commandMatches.map((x,i)=>`<button type="button" data-command-index="${i}"><span>${I('search',15)}</span><span><b>${esc(x.label)}</b><small>${esc(x.sub)}</small></span>${I('chevron',14)}</button>`).join(''):'<p class="mm41-command-empty">Nenhum resultado. Tente outro nome, pedido ou módulo.</p>';
}
function showCommand(){const d=document.getElementById('mm41-command');d.showModal();const input=document.getElementById('mm41-command-input');input.value='';commandRender('');input.focus()}
function commandGo(i){
 const x=commandMatches[i];if(!x)return;
 document.getElementById('mm41-command').close();
 page=x.to;search=x.term||'';mobileMenu=false;
 if(page==='ia'&&aiTab==='office')aiTab='meeting';render();window.scrollTo(0,0)
}
function exportDemoBackup(){
 const payload={app:'MM Intelligence',version:'4.1',profile,exportedAt:new Date().toISOString(),data:store};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`MM-Intelligence-4.1-${profile}-${today()}.json`;a.click();URL.revokeObjectURL(url);
 toast('Dados de teste exportados em JSON. Este arquivo não sincroniza com o site real.');
}
const cmd=document.getElementById('mm41-command');
cmd.querySelector('#mm41-command-input').addEventListener('input',e=>commandRender(e.target.value));
cmd.querySelector('#mm41-command-results').addEventListener('click',e=>{const n=e.target.closest('[data-command-index]');if(n)commandGo(Number(n.dataset.commandIndex))});
cmd.querySelector('#mm41-command-close').addEventListener('click',()=>cmd.close());
cmd.querySelector('#mm41-command-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commandGo(0)}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(cmd.open)cmd.close();else showCommand()}});
function csvRows(text){const delimiter=text.split(/\r?\n/,1)[0].includes(';')?';':',';const rows=[],out=[];let val='',inside=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(inside&&text[i+1]==='"'){val+='"';i++}else inside=!inside}else if(c===delimiter&&!inside){out.push(val);val=''}else if((c==='\n'||c==='\r')&&!inside){if(c==='\r'&&text[i+1]==='\n')i++;out.push(val);rows.push([...out]);out.length=0;val=''}else val+=c}if(inside)throw Error('CSV com aspas não fechadas.');if(val||out.length){out.push(val);rows.push(out)}return rows}
try{const stored=localStorage.getItem(KEY+'-active');profile=['ecommerce','servicos','hibrido'].includes(stored)?stored:'ecommerce';const t=localStorage.getItem(KEY+'-theme');theme=['dark','light'].includes(t)?t:'light';const raw=JSON.parse(localStorage.getItem(KEY+'-profile')||'{}');displayName=typeof raw.name==='string'?raw.name:'Usuário de demonstração';profilePhoto=typeof raw.photo==='string'&&raw.photo.startsWith('data:image/')?raw.photo:'';}catch{}store=load(profile);render();setInterval(updateClock,15000);
})();
